version: '3.8'

services:
  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/saferoute}
      - DEBUG=${DEBUG:-False}
      - MAPBOX_TOKEN=${MAPBOX_TOKEN}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
    volumes:
      - backend-data:/app/data
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - saferoute-network

  # PostgreSQL with PostGIS extension (optional but recommended for production)
  postgres:
    image: postgis/postgis:15-3.3
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=saferoute
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init_postgis.sql:/docker-entrypoint-initdb.d/init_postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saferoute-network

  # Redis for caching (optional but recommended for production)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saferoute-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_MAPBOX_TOKEN=${MAPBOX_TOKEN}
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - saferoute-network

volumes:
  backend-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  saferoute-network:
    driver: bridge

# Profiles for optional services
profiles:
  # Profile for development with SQLite (no external services)
  sqlite:
    services:
      backend:
        environment:
          - DATABASE_URL=sqlite:///./saferoute.db
        depends_on: []  # Remove postgres and redis dependencies
  # Profile for production with PostgreSQL and Redis
  production:
    services:
      backend:
        environment:
          - DEBUG=false
      postgres:
        # Already defined above
      redis:
        # Already defined above