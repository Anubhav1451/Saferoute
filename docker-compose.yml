version: '3.8'

services:
  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/saferoute}
      - DEBUG=${DEBUG:-False}
      - MAPBOX_TOKEN=${MAPBOX_TOKEN}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
    volumes:
      - backend-data:/app/data
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - saferoute-network

  # PostgreSQL with PostGIS extension (optional but recommended for production)
  postgres:
    image: postgis/postgis:15-3.3
    restart: unless-stopped
    # SEC-15: bind to loopback only so the DB is reachable from the host for
    # local tooling but NOT published to the LAN. Containers reach it over the
    # internal bridge network. (Previously "5432:5432" exposed it host-wide
    # with default credentials.)
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=saferoute
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init_postgis.sql:/docker-entrypoint-initdb.d/init_postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saferoute-network

  # Redis for caching (optional but recommended for production)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # SEC-15: same loopback-only binding as postgres; containers use the
    # internal bridge network, not a host-published port.
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saferoute-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_MAPBOX_TOKEN=${MAPBOX_TOKEN}
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - saferoute-network

volumes:
  backend-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  saferoute-network:
    driver: bridge

# Profiles for optional services
profiles:
  # Profile for development with SQLite (no external services)
  sqlite:
    services:
      backend:
        environment:
          - DATABASE_URL=sqlite:///./saferoute.db
        depends_on: []  # Remove postgres and redis dependencies
  # Profile for production with PostgreSQL and Redis
  production:
    services:
      backend:
        environment:
          - DEBUG=false
          # SEC-15: fail the compose up if API keys aren't provided. This turns
          # auth ON for every API route (all /api/v1/* and /metrics are
          # protected; only the exempt list stays public) and prevents a
          # misconfigured public deploy. Provide API_KEYS at deploy time.
          - API_KEY_REQUIRED=true
          - API_KEYS=${API_KEYS:?API_KEYS must be set when using the production profile}
          # SEC-16 (T1): enable the defense-in-depth middleware ONLY in the
          # production profile. Local developer defaults (config.py) stay off.
          - RATE_LIMIT_ENABLED=true
          - REQUEST_TIMEOUT_ENABLED=true
          - REQUEST_SIZE_LIMIT_ENABLED=true
          # SEC-16 (T6): fail fast instead of silently falling back to the
          # default postgres:postgres URL. The top-level default below is only
          # for local full-stack development.
          - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set when using the production profile}
      postgres:
        # SEC-16 (T6): require an explicit DB password in production so a
        # misconfigured deploy cannot boot PostgreSQL with the well-known
        # 'postgres' password. Local development keeps the top-level default.
        environment:
          - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set when using the production profile}
      redis:
        # Already defined above