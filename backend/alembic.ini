# Alembic Configuration for SafeRoute AI

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
# prepend_sys_path = .

# version path separator; As mentioned above, this is the character used to split
# version_locations string, within which versions located within non-directory
# based resources will be found.
# version_path_separator = :

# The output encoding used when revision files are written from script.get_current_revision()
output_encoding = utf-8

sqlalchemy.url = sqlite:///./saferoute.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
#format = %(levelname)-5.5s [%(name)s] %(asctime)s %(message)s